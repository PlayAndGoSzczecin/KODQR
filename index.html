<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta Gry</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }

        .cover-container {
            width: 100%;
            height: 280px;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 24px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .badge-platform {
            display: inline-block;
            background-color: #0070d1;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .prices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .price-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e9ecef;
            text-align: center;
        }

        .price-box.full-width {
            grid-column: span 2;
            background: #f0f7ff;
            border-color: #cce5ff;
        }

        .price-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .price-value {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
        }

        .price-box.full-width .price-value {
            color: #0056b3;
            font-size: 24px;
        }

        .info-note {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card" id="game-card">
    <div class="cover-container">
        <img id="game-cover" src="" alt="Okładka gry" style="display:none;">
    </div>
    
    <div class="content">
        <span class="badge-platform" id="game-platform">Ładowanie...</span>
        <h1 class="title" id="game-title">Ładowanie danych...</h1>

        <div class="prices-grid">
            <div class="price-box full-width">
                <div class="price-label">Cena sprzedaży (używana)</div>
                <div class="price-value" id="price-used">-- zł</div>
            </div>
            
            <div class="price-box">
                <div class="price-label">Wycena przy gotówce</div>
                <div class="price-value" id="price-cash">-- zł</div>
            </div>

            <div class="price-box">
                <div class="price-label">Wycena przy wymianie</div>
                <div class="price-value" id="price-trade">-- zł</div>
            </div>
        </div>

        <div class="info-note">
            💡 Podana wycena dotyczy gier zakupionych w naszym sklepie. Dla gier pochodzących z zewnątrz wycena może być ustalana indywidualnie.
        </div>
    </div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS40Z0GFrx-9ueUVPMu7__BtUtj0p8X-rMHp5hqpLxmcIF0FDPf4qbnrm5g0ogJTM2_sZcpMh-ePyBd/pub?output=csv';

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    async function fetchGameData() {
        const gameId = getQueryParam('id');
        
        if (!gameId) {
            document.getElementById('game-card').innerHTML = '<div class="error-message">Zeskanowano kod bez identyfikatora gry.</div>';
            return;
        }

        try {
            const response = await fetch(SHEET_CSV_URL);
            const csvText = await response.text();
            
            const rows = csvText.split('\n').map(row => row.split(','));
            
            // Szukamy po ID w kolumnie H (indeks 7)
            const gameRow = rows.find(row => row[7] && row[7].trim().toLowerCase() === gameId.trim().toLowerCase());

            if (gameRow) {
                document.getElementById('game-title').innerText = gameRow[0].replace(/"/g, '') || 'Brak tytułu';
                document.getElementById('game-platform').innerText = gameRow[1].replace(/"/g, '') || 'Platforma';
                
                const coverUrl = gameRow[2].replace(/"/g, '');
                if (coverUrl && coverUrl.startsWith('http')) {
                    const coverImg = document.getElementById('game-cover');
                    coverImg.src = coverUrl;
                    coverImg.style.display = 'block';
                }

                document.getElementById('price-used').innerText = (gameRow[11] || '--').replace(/"/g, '') + ' zł'; // Kolumna L
                document.getElementById('price-cash').innerText = (gameRow[8] || '--').replace(/"/g, '') + ' zł';  // Kolumna I
                document.getElementById('price-trade').innerText = (gameRow[9] || '--').replace(/"/g, '') + ' zł'; // Kolumna J
            } else {
                document.getElementById('game-card').innerHTML = '<div class="error-message">Nie znaleziono gry o podanym ID.</div>';
            }
        } catch (error) {
            console.error('Błąd:', error);
            document.getElementById('game-card').innerHTML = '<div class="error-message">Błąd pobierania danych z arkusza.</div>';
        }
    }

    fetchGameData();
</script>

</body>
</html>
